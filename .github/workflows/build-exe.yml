name: Build EXE

on:
  workflow_dispatch: # Permet de lancer le build manuellement

jobs:
  build:
    runs-on: windows-latest # Nécessaire pour créer un .exe Windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Ajustez selon la version utilisée par votre code

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # Si vous avez un fichier requirements.txt, décommentez la ligne suivante :
        # pip install -r requirements.txt

    - name: Build with PyInstaller
      run: pyinstaller --onefile suivi_retard.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: suivi_retard-exe
        path: dist/suivi_retard.exe
